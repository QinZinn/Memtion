# Memtion - bảng ánh xạ meme <-> tư thế / biểu cảm.
#
# Mỗi [[meme]] có:
#   id        tên ngắn, duy nhất
#   file      đường dẫn ảnh (tương đối so với file này)
#   label     chữ hiển thị dưới meme
#   priority  hệ số nhân điểm (mặc định 1.0). Tư thế tay/cơ thể đặt cao hơn
#             biểu cảm khuôn mặt để không bị nụ cười "cướp" mất.
#   when      các đặc trưng CẦN có:   ten_dac_trung = trọng_số
#   not       các đặc trưng KHÔNG được có
#
# Điểm = priority * trung bình nhân có trọng số của các đặc trưng (0..1).
# Đặc trưng nặng ký mà thiếu -> điểm gần 0; đặc trưng nhẹ ký chỉ làm giảm chút ít.
# Chạy `python -m memtion --debug` để xem giá trị đặc trưng trực tiếp và chỉnh ở đây.
#
# Danh sách đặc trưng (đều nằm trong khoảng 0..1):
#   Mặt:  face smile mouth_open eyes_closed eyes_wide squint eyes_shut brow_up
#         brow_down frown pucker smirk grimace look_up gaze_up
#         head_up head_down head_turn head_tilt
#   Tay theo vùng quanh mặt, với <vùng> = chin neck cheek side head front above:
#         hand_<vùng>       (ít nhất 1 tay ở đó)
#         one_hand_<vùng>   (đúng 1 tay)
#         both_hands_<vùng> (cả 2 tay)
#   Khác: thumbs_up pointing arms_crossed lean hands_free hands_visible

[settings]
fallback = "blank_stare"  # meme hiện khi không có gì khớp đủ mạnh
min_score = 0.5           # điểm tối thiểu để một meme được chọn
smoothing = 0.4           # 0..1, nhỏ hơn = mượt hơn nhưng phản ứng chậm hơn
hold_frames = 4           # số khung hình meme mới phải dẫn đầu trước khi đổi
switch_margin = 0.05      # meme mới phải hơn meme hiện tại ít nhất chừng này

# Ghi đè ngưỡng [thấp, cao] của đặc trưng (xem memtion/features.py).
# Giá trị thô <= thấp -> 0, >= cao -> 1.
[thresholds]
# smile = [0.25, 0.65]
# head_down = [8.0, 22.0]   # độ

