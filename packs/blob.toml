# Memtion - pack "Blob": 30 meme mặt vẽ tay trong Blob_Meme/.
# Hầu hết là biểu cảm khuôn mặt, nên pack này "đọc mặt" nhiều hơn pack gốc.
# Cú pháp và danh sách đặc trưng: xem packs/default.toml.
#
# Một số meme không có biểu cảm tương ứng mà MediaPipe đo được (lè lưỡi, đeo kính,
# hề, bó hoa...) nên được gán cho một tư thế "gần nghĩa" nhất, ghi trong label.

[pack]
name = "Blob"
order = 1

[settings]
fallback = "deadpan"
min_score = 0.5
smoothing = 0.4
hold_frames = 4
switch_margin = 0.05

# ------------------------------------------------------------ tay / cử chỉ

[[meme]]
id = "thumbs_down"
file = "../Blob_Meme/24_thumbs_down.png"
label = "Không ổn rồi"
priority = 1.25
when = { thumbs_down = 1.0 }

[[meme]]
id = "nerd"
file = "../Blob_Meme/31_nerd.png"
label = "Chuẩn không cần chỉnh"
priority = 1.25
when = { thumbs_up = 1.0 }

[[meme]]
id = "heart_hands"
file = "../Blob_Meme/20_heart_hands.png"
label = "Thương thương"
priority = 1.15
when = { hands_visible = 1.0, smile = 0.6 }
not = { hands_free = 0.4 }

[[meme]]
id = "oxygen"
file = "../Blob_Meme/12_oxygen.png"
label = "Thở oxy gấp"
priority = 1.15
when = { hand_chin = 1.0, eyes_shut = 0.2 }
not = { smile = 0.5 }

[[meme]]
id = "flowers"
file = "../Blob_Meme/15_flowers.png"
label = "Tặng bạn nè"
priority = 1.1
when = { hand_front = 1.0, smile = 0.4 }

